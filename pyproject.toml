[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge"
version = "0.1.0"
description = "Synthetic closed-loop simulator for adaptive neural-bio therapy research workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "NeuroForge Contributors" }
]
license = { text = "Proprietary" }
keywords = ["synthetic-data", "bci", "biomarkers", "drug-discovery", "simulation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.111",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.22",
  "pydantic>=2.7",
  "scipy>=1.13",
  "streamlit>=1.36",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[project.scripts]
neuroforge-demo = "neuroforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
