[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge"
version = "0.1.0"
description = "NeuroForge — software-only, fully-simulated adaptive closed-loop molecular therapy demo (research only, not a medical device)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NeuroForge" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rdkit>=2023.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.0",
]
openai = ["openai>=1.0"]

[project.scripts]
neuroforge = "neuroforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
