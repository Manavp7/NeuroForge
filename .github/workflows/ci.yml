name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check neuroforge tests
      - name: Format check (black)
        run: black --check neuroforge tests
      - name: Tests
        run: pytest
      - name: Benchmark (regression)
        run: python -m neuroforge.cli bench --n 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend
        run: pip install -e .
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Chrome for Playwright
        run: npx playwright install chrome
        working-directory: frontend
      - name: Run e2e
        run: npm run e2e
        working-directory: frontend
        env:
          CI: "1"
