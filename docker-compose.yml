# NeuroForge — one-command full stack (research/simulation only, not a medical device).
# Usage: docker compose up --build
#   backend  -> http://localhost:8000/docs
#   frontend -> http://localhost:5173

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NEUROFORGE_DB=/data/neuroforge.db
    volumes:
      - neuroforge-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the host-published backend port.
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neuroforge-data:
